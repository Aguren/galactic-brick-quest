<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  
  <!-- Apple Fullscreen Web App Meta -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dark Side Conquest" />
  
  <title>Lord Athen: Dark Side Conquest</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="game-viewport">
  <canvas id="arcadeCanvas"></canvas>

  <!-- Arcade HUD -->
  <div id="hud">
    <div class="hud-box">PILOT: <span>LORD ATHEN</span></div>
    <div class="hud-box">SCORE: <span id="score-val">0</span></div>
    <div class="hud-box">SHIELD: <span id="shield-val">100%</span></div>
  </div>

  <!-- Launch Screen -->
  <div id="menu-overlay" class="overlay">
    <h1 class="glow-title">⚡ LORD ATHEN ⚡</h1>
    <h2 class="sub-title">DARK SIDE CONQUEST</h2>
    <p class="desc">Drag your finger across the screen to control your Sith Interceptor.<br>Destroy Jedi fighters and intercept incoming missile codes!</p>
    <button id="start-btn" class="arcade-btn">LAUNCH MISSION</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
